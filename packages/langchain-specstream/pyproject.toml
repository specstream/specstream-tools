[project]
name = "langchain-specstream"
version = "0.2.2"
description = "The live web data engine for LangChain: Search API ($5 per 1,000 searches of up to 10 results, or $1 on the fast tier), Extract API ($0.80 per 1,000 pages) and Deep Search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = ["langchain", "specstream", "agents", "tools", "retriever", "web-data", "live-web", "lead-lists", "research", "lead-generation", "lead-list", "company-list", "grants"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["langchain-core>=0.3.0,<2.0.0"]

[project.optional-dependencies]
test = ["pytest>=8", "langchain-tests>=0.3"]

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs/langchain"
Repository = "https://github.com/specstream/specstream-tools/tree/main/packages/langchain-specstream"
Issues = "https://github.com/specstream/specstream-tools/issues"
Pricing = "https://specstream.ai/pricing"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_specstream"]

[tool.hatch.build.targets.sdist]
include = ["langchain_specstream", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
