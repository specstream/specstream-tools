[project]
name = "specstream-client"
version = "1.3.0"
description = "Python client for building lead lists and company lists from the live web. Every match comes with its source, priced before it runs."
readme = "README.txt"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = [
  "specstream",
  "cross-source",
  "local_business",
  "creator",
  "organization",
  "storefront_product",
  "app_listing",
  "job_posting",
  "scholarly_work",
  "tender",
  "grant",
  "lead-generation",
  "lead-list",
  "company-list",
  "grants",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://specstream.ai"
API = "https://api.specstream.ai"

[project.scripts]
specstream = "specstream_client.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specstream_client"]
