[project]
name = "praisonai-specstream"
version = "0.1.0"
description = "SpecStream web search provider for PraisonAI: the Search API ($5 per 1,000 searches of up to 10 results, $1 on the fast tier) and the Extract API ($0.80 per 1,000 pages)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = ["praisonai", "praisonaiagents", "specstream", "web-search", "search-api", "extract-api", "agents", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["praisonaiagents>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."praisonai.tools.search"]
specstream = "praisonai_specstream:SpecStreamTool"

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs/api"
Repository = "https://github.com/specstream/specstream-tools/tree/main/packages/praisonai-specstream"
Issues = "https://github.com/specstream/specstream-tools/issues"
Pricing = "https://specstream.ai/pricing"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praisonai_specstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
