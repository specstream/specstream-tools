[project]
name = "airflow-provider-specstream"
version = "0.1.0"
description = "SpecStream for Apache Airflow: the live web data engine. Search API, Extract API and Deep Search operators and a hook."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = ["airflow", "apache-airflow", "airflow-provider", "specstream", "web-search", "web-data", "live-web", "extract", "etl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Apache Airflow",
  "Framework :: Apache Airflow :: Provider",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["apache-airflow>=2.9.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.entry-points.apache_airflow_provider]
provider_info = "specstream_provider:get_provider_info"

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs"
Repository = "https://github.com/specstream/specstream-tools/tree/main/packages/airflow-provider-specstream"
Issues = "https://github.com/specstream/specstream-tools/issues"
Pricing = "https://specstream.ai/pricing"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specstream_provider"]

[tool.hatch.build.targets.sdist]
include = ["specstream_provider", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
