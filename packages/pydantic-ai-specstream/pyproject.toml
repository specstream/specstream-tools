[project]
name = "pydantic-ai-specstream"
version = "0.1.0"
description = "The live web data engine for Pydantic AI: Search API ($5 per 1,000 searches), Extract API ($0.80 per 1,000 pages) and Deep Search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = ["pydantic-ai", "specstream", "agents", "tools", "toolset", "web-search", "search-api", "extract-api", "web-data", "live-web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["pydantic-ai-slim>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs/api"
Repository = "https://github.com/specstream/specstream-tools/tree/main/packages/pydantic-ai-specstream"
Issues = "https://github.com/specstream/specstream-tools/issues"
Pricing = "https://specstream.ai/pricing"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_specstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
