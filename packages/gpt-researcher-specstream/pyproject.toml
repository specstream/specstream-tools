[project]
name = "gpt-researcher-specstream"
version = "0.1.0"
description = "The live web data engine for GPT Researcher: Search API ($5 per 1,000 searches), Extract API ($0.80 per 1,000 pages) and Deep Search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = ["gpt-researcher", "specstream", "web-search", "search-api", "extract-api", "retriever", "research", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."gpt_researcher.retrievers"]
specstream = "gpt_researcher_specstream:SpecStreamSearch"

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs/api"
Repository = "https://github.com/specstream/specstream-tools/tree/main/packages/gpt-researcher-specstream"
Issues = "https://github.com/specstream/specstream-tools/issues"
Pricing = "https://specstream.ai/pricing"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpt_researcher_specstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
