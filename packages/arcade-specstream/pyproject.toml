[project]
name = "arcade-specstream"
version = "0.1.0"
description = "SpecStream for Arcade: Deep Search lists from the live web with the source page of every row, plus the Search API and the Extract API."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
maintainers = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = ["arcade", "arcade-ai", "arcade-mcp", "toolkit", "mcp", "specstream", "agents", "tools", "web-data", "live-web", "deep-search", "web-search", "extract", "lead-lists", "company-list"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["arcade-mcp-server>=1.17.0,<2.0.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
arcade-specstream = "arcade_specstream.__main__:main"
arcade_specstream = "arcade_specstream.__main__:main"

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs"
Repository = "https://github.com/specstream/specstream-tools/tree/main/packages/arcade-specstream"
Issues = "https://github.com/specstream/specstream-tools/issues"
Pricing = "https://specstream.ai/pricing"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arcade_specstream"]

[tool.hatch.build.targets.sdist]
include = ["arcade_specstream", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
