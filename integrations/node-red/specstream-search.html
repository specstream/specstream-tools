<script type="text/javascript">
RED.nodes.registerType("specstream search", {
  category: "network",
  color: "#a6bbcf",
  defaults: { name: { value: "" }, server: { value: "", type: "specstream-config", required: true }, query: { value: "" }, limit: { value: "" } },
  inputs: 1, outputs: 1, icon: "white-globe.svg",
  label: function () { return this.name || "specstream search"; }
});
</script>
<script type="text/html" data-template-name="specstream search">
  <div class="form-row"><label>Name</label><input type="text" id="node-input-name"></div>
  <div class="form-row"><label>API key</label><input type="text" id="node-input-server"></div>
  <div class="form-row"><label>Query</label><input type="text" id="node-input-query" placeholder="or msg.payload"></div>
  <div class="form-row"><label>Limit</label><input type="text" id="node-input-limit"></div>
</script>
<script type="text/html" data-help-name="specstream search">
  <p>Runs <code>GET /v1/web-search</code> on the SpecStream Search API. The query comes from <code>msg.payload</code> or the Query field. The result is in <code>msg.payload</code>.</p>
</script>
