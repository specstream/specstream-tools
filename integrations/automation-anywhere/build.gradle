// The build file of the Automation Anywhere Package SDK 2.13.0, with this package's name and
// without the sample's own libraries. get-sdk.sh puts the SDK's jars in libs/.
buildscript {
	repositories {
		gradlePluginPortal()
		flatDir {
			dirs 'libs'
		}
		dependencies {
			classpath name:'package-compileonly-sdk', version: '1.7.0'
			classpath "gradle.plugin.com.github.johnrengelman:shadow:7.1.1"
		}
	}
}

plugins {
	id 'java'
}

apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: "com.automationanywhere.command-codegen"

ext {
	groupName = 'ai.specstream'
	version '1.0.0'
}
group "$groupName"

sourceCompatibility = JavaVersion.VERSION_11

compileJava.options.encoding = 'UTF-8'

repositories {
	mavenCentral()
	flatDir {
		dirs 'libs'
	}
}

packageJson {
	artifactName = project.name
	group = "$groupName"
	author = "SpecStream"
	generatePackageWithDateTime = false
}

classes.dependsOn commandCodeGen

shadowJar {
	archiveBaseName = project.name
	classifier = null
	zip64 = true
	exclude 'META-INF/MANIFEST.MF'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
}

dependencies {
	annotationProcessor name: 'package-compileonly-sdk', version: '1.7.0'
	compileOnly name: 'package-compileonly-sdk', version: '1.7.0'
	implementation name: 'package-runtime-sdk', version: '1.0.0'
}
