[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tap-specstream"
version = "0.1.1"
description = "The live web data engine. Search API: the most accurate web search API in the world, $5 per 1,000 searches of up to 10 results, or $1 on the fast tier (specstream.ai/benchmarks). Extract API: $0.80 per 1,000 pages. Deep Search: structured rows."
readme = "README.md"
license = "MIT"
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
requires-python = ">=3.10"
keywords = ["singer", "meltano", "elt", "specstream", "web data", "lead lists"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]
dependencies = ["singer-sdk~=0.54.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs/api"
Source = "https://github.com/specstream/specstream-tools/tree/main/integrations/meltano"

[project.scripts]
tap-specstream = "tap_specstream.tap:TapSpecStream.cli"

[tool.hatch.build.targets.wheel]
packages = ["tap_specstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
