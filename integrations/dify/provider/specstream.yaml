identity:
  author: specstream
  name: specstream
  label:
    en_US: SpecStream
  description:
    en_US: The live web data engine. One platform to build, search, extract, enrich, map, and monitor data across the entire web.
  icon: icon.png
  tags:
    - search
    - business
credentials_for_provider:
  specstream_api_key:
    type: secret-input
    required: true
    label:
      en_US: SpecStream API key
    placeholder:
      en_US: ss_live_...
    help:
      en_US: Create a key in SpecStream under Agents & API. New accounts get $10 of credit.
    url: https://specstream.ai/workspace/settings
tools:
  - tools/web_search.yaml
  - tools/extract_pages.yaml
  - tools/find_list.yaml
  - tools/get_list_results.yaml
  - tools/research_report.yaml
  - tools/get_research_report.yaml
  - tools/open_browser.yaml
  - tools/browser_step.yaml
  - tools/close_browser.yaml
  - tools/find_public_records.yaml
  - tools/get_public_records.yaml
  - tools/create_monitor.yaml
  - tools/get_monitor_runs.yaml
extra:
  python:
    source: provider/specstream.py
