identity:
  name: open_browser
  author: specstream
  label:
    en_US: Open Browser
description:
  human:
    en_US: Open a real browser on SpecStream's server for pages that need clicks, forms or scripts. $0.10 an hour, charged by the second, plus $1 per 1,000 steps.
  llm: Opens a real Chromium browser on SpecStream's server and returns its session ID (it starts with brs_). Use it for pages that need a real browser, such as forms, clicks and pages drawn by scripts; for the text of known pages Extract Pages is faster and cheaper. When a URL is given, the browser opens it and returns the page's text as markdown. Drive the browser with Browser Step and the session ID, then call Close Browser when the task is done. The session is charged $0.10 an hour by the second while it runs, plus $0.001 for each step, and it ends on its own after the maximum minutes set on this tool or after 5 minutes without a step. A page whose site opted out, whose robots.txt disallows SpecStream or that is outside the allowed hosts is refused as blocked.
parameters:
  - name: url
    type: string
    required: false
    form: llm
    label:
      en_US: URL
    human_description:
      en_US: A page to open first. Its text comes back with the session ID.
    llm_description: The full address of a page to open first, starting with https://. Its text comes back as markdown. Leave empty to open the browser with no page.
  - name: max_minutes
    type: number
    required: true
    form: form
    default: 5
    min: 1
    max: 60
    label:
      en_US: Maximum minutes
    human_description:
      en_US: The longest the browser stays open, from 1 to 60 minutes. Set by you, never by the model. An hour costs $0.10, so 5 minutes cost at most 1¢ plus the steps.
  - name: allowed_domains
    type: string
    required: false
    form: form
    label:
      en_US: Allowed hosts
    human_description:
      en_US: Hosts the browser may open, separated by commas, such as example.com or *.example.com. Empty allows every public host.
extra:
  python:
    source: tools/open_browser.py
