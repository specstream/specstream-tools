#cloud-config
# SpecStream research agent: vendor data for a Vultr Marketplace build on Ubuntu 24.04.
# Written by integrations/vultr/build.py from the files beside it. Do not edit by hand.
write_files:
  - path: /opt/specstream-research/src/app/research_agent.py
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/specstream-research/src/files/specstream-research.service
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/specstream-research/src/files/nginx.conf
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: 
  - path: /opt/specstream-research/src/scripts/install.sh
    owner: root:root
    permissions: '0755'
    encoding: b64
    content: 
  - path: /opt/specstream-research/src/scripts/provision.sh
    owner: root:root
    permissions: '0755'
    encoding: b64
    content: 
runcmd:
  - [bash, /opt/specstream-research/src/scripts/install.sh]
  - [bash, /var/lib/cloud/scripts/per-instance/provision.sh]
