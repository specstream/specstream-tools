# The research agent's page: HTTPS in front of the agent, which listens on this server only.
# The certificate is made on first boot for this server's own address (scripts/provision.sh).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location = /healthz { proxy_pass http://127.0.0.1:8080; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/specstream-research/tls/cert.pem;
    ssl_certificate_key /etc/specstream-research/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
