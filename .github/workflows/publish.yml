# Publishes the n8n community node, the Activepieces piece, the OpenCode and OpenClaw plugins, the Pi package, the Convex component
# and the DeepSeek Harness plugin, and the Twenty CRM app,
# to npm with a provenance statement.
#
# n8n only verifies community nodes that are published from GitHub Actions with
# provenance. Each package trusts this file (publish.yml in specstream/specstream-tools)
# as its npm Trusted Publisher, so no token is stored here.
#
# Run it from the Actions tab, or:  gh workflow run publish.yml -f package=n8n
name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options:
          - n8n
          - activepieces
          - opencode
          - openclaw
          - pi
          - convex
          - dsh
          - twenty-app
        default: n8n
  push:
    tags:
      - "n8n-v*"
      - "activepieces-v*"
      - "opencode-v*"
      - "openclaw-v*"
      - "pi-v*"
      - "convex-v*"
      - "dsh-v*"
      - "twenty-app-v*"

jobs:
  n8n:
    if: inputs.package == 'n8n' || startsWith(github.ref, 'refs/tags/n8n-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm 11.5+ publishes through an npm Trusted Publisher (OIDC) with no token.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish with provenance
        env:
          RELEASE_MODE: "true"
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  activepieces:
    if: inputs.package == 'activepieces' || startsWith(github.ref, 'refs/tags/activepieces-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/activepieces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  opencode:
    if: inputs.package == 'opencode' || startsWith(github.ref, 'refs/tags/opencode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  openclaw:
    if: inputs.package == 'openclaw' || startsWith(github.ref, 'refs/tags/openclaw-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run plugin:validate
      - name: Publish with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  pi:
    if: inputs.package == 'pi' || startsWith(github.ref, 'refs/tags/pi-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  convex:
    if: inputs.package == 'convex' || startsWith(github.ref, 'refs/tags/convex-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/convex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run verify
      - name: Publish with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  dsh:
    if: inputs.package == 'dsh' || startsWith(github.ref, 'refs/tags/dsh-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dsh-plugin-specstream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      # No dependencies and no lock file: nothing to install.
      - run: npm test
      - name: Publish with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  # A Twenty app is not published with `npm publish`: `twenty app publish` builds the app's manifest and packs it,
  # on Node 24 and Yarn 4, and adds the provenance itself. Twenty reads that provenance when the app is claimed
  # (Settings > Developers > Apps > Claim with GitHub) before its marketplace review. The CLI version is the one
  # the app was scaffolded with: change it together with twenty-sdk, twenty-client-sdk and twenty-ui in the app's
  # package.json.
  twenty-app:
    if: inputs.package == 'twenty-app' || startsWith(github.ref, 'refs/tags/twenty-app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/twenty/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm 11.5.1+ publishes through an npm Trusted Publisher (OIDC) with no token.
      - run: npm install -g npm@latest
      - run: npm install -g twenty@2.58.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:unit
      # Builds the same manifest the publish step packs, so a broken build stops before anything is uploaded.
      - run: twenty app build
      - name: Publish with provenance
        run: twenty app publish
