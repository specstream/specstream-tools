# Publishes one SDK or proxy package. Run it from the Actions tab, or:
#   gh workflow run release.yml -f package=sdk-ts
#
# The n8n node has its own workflow, publish.yml, because n8n requires that file name.
#
# No tokens: every package trusts this file (release.yml in specstream/specstream-tools)
# as its Trusted Publisher on npm and PyPI. A new PyPI project needs a pending publisher first.
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options:
          - sdk-ts
          - sdk-py
          - mcp-stdio
          - langchain
          - llamaindex
          - crewai
          - haystack
          - ai-sdk
          - langchain-js
          - gpt-researcher
          - pydantic-ai
          - airflow
          - ruby
      rubygems_owner:
        description: "ruby, first publish only: the RubyGems.org account ID shown on that account's Pending Trusted Publishers page"
        type: string
        required: false
        default: ""

jobs:
  npm:
    if: ${{ contains(fromJSON('["sdk-ts","ai-sdk","langchain-js"]'), inputs.package) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ fromJSON('{"sdk-ts":"packages/sdk-ts","ai-sdk":"packages/ai-sdk","langchain-js":"packages/langchain-js"}')[inputs.package] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm 11.5+ publishes through an npm Trusted Publisher (OIDC) with no token.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish with provenance
        run: npm publish --access public --provenance

  pypi:
    if: ${{ contains(fromJSON('["sdk-py","mcp-stdio","langchain","llamaindex","crewai","haystack","gpt-researcher","pydantic-ai","airflow"]'), inputs.package) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ fromJSON('{"sdk-py":"packages/sdk-py","mcp-stdio":"packages/mcp-stdio","langchain":"packages/langchain-specstream","llamaindex":"packages/llama-index-tools-specstream","crewai":"packages/crewai-specstream","haystack":"packages/specstream-haystack","gpt-researcher":"packages/gpt-researcher-specstream","pydantic-ai":"packages/pydantic-ai-specstream","airflow":"packages/airflow-provider-specstream"}')[inputs.package] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          mv dist "$GITHUB_WORKSPACE/dist"
      # Trusted Publisher upload (OIDC), with attestations.
      - uses: pypa/gh-action-pypi-publish@release/v1

  # RubyGems trusted publishing (OIDC): the gem "specstream" trusts this file
  # (release.yml in specstream/specstream-tools), so no API key is stored here.
  # A new gem needs a pending trusted publisher on rubygems.org first.
  rubygems:
    if: ${{ inputs.package == 'ruby' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/specstream-ruby
    steps:
      - uses: actions/checkout@v4
      # The runner's own Ruby (3.2 on ubuntu-24.04) and a plain OIDC exchange, the same calls as
      # rubygems/configure-rubygems-credentials: the org allows only GitHub's and specstream/* actions.
      - run: ruby --version
      - run: for f in test/test_*.rb; do ruby -Ilib -Itest "$f" || exit 1; done
      - run: gem build specstream.gemspec
      - name: Exchange the GitHub OIDC token for a short-lived RubyGems key
        env:
          RUBYGEMS_OWNER: ${{ inputs.rubygems_owner }}
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$jwt"
          body=$(JWT="$jwt" OWNER="$RUBYGEMS_OWNER" python3 -c 'import json, os; d = {"jwt": os.environ["JWT"]}; d.update({"owner": os.environ["OWNER"]} if os.environ["OWNER"] else {}); print(json.dumps(d))')
          reply=$(curl -sS -X POST -H "Content-Type: application/json" -H "Accept: application/json" -d "$body" https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          gemkey=$(printf '%s' "$reply" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("rubygems_api_key", ""))' 2>/dev/null || true)
          if [ -z "$gemkey" ]; then echo "No trusted publisher on rubygems.org accepted this workflow: $(printf '%s' "$reply" | head -c 300)"; exit 1; fi
          echo "::add-mask::$gemkey"
          echo "GEM_HOST_API_KEY=$gemkey" >> "$GITHUB_ENV"
      - run: gem push specstream-*.gem
